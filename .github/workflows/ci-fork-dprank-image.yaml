# Builds the EPP image from the dprank branch on smurthy024's fork.
# Upstream ci-dev.yaml skips forks (github.event.repository.fork == true).
#
# EPP is a pure Go binary — one linux/amd64 image serves both ROCm and NVIDIA
# decode clusters. GPU vendor is determined by the vLLM decode image, not EPP.
#
# Manual run:
#   gh workflow run ci-fork-dprank-image.yaml -R smurthy024/llm-d-router \
#     -f tag=dprank-88c0edd
name: Fork - Build dprank EPP image

on:
  push:
    branches:
      - dprank
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (pushed to ghcr.io/smurthy024/llm-d-router)
        required: true
        default: dprank-88c0edd
      platform:
        description: Docker platform (cluster nodes are linux/amd64)
        required: true
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  build-epp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA::7}"
            echo "tag=dprank-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push EPP (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.epp
          push: true
          platforms: ${{ steps.meta.outputs.platform }}
          tags: |
            ghcr.io/smurthy024/llm-d-router:${{ steps.meta.outputs.tag }}
            ghcr.io/smurthy024/llm-d-router:dprank-latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_REF=${{ steps.meta.outputs.tag }}
            LDFLAGS=-s -w
          cache-from: type=gha,scope=smurthy024-dprank-epp
          cache-to: type=gha,mode=max,scope=smurthy024-dprank-epp

      - name: Image summary
        run: |
          echo "### EPP image" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/smurthy024/llm-d-router:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- platform: \`${{ steps.meta.outputs.platform }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
